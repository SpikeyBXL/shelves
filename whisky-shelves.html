<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisky shelves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#14100D; --panel:#1D1712; --board:#33261B; --edge:#8A5C33;
  --label:#EDE4D3; --label-2:#B8AA92; --ink:#241C14; --amber:#D69A3C; --over:#C4553C;
  --line:rgba(237,228,211,.13); --slot:rgba(237,228,211,.10);
  --f-ui:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cd:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--night);color:var(--label);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--label);background:#100D0A;border:1px solid var(--line);border-radius:3px;padding:6px 8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
select option{background:#100D0A}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 120px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:8px 30px;align-items:start}
.colhead{font-family:var(--f-cd);font-size:14px;color:var(--label-2);letter-spacing:.07em;
  padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:14px}
.wide{grid-column:1/-1}
.seq{font-family:var(--f-cd);font-size:12px;font-weight:600;background:var(--amber);color:#1A1208;
  border-radius:2px;padding:0 5px;line-height:1.5}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--label-2)}
.flow .btn{padding:4px 10px;font-size:13px}
.flow .btn.on{background:var(--amber);color:#1A1208;border-color:var(--amber)}
.tray{border:1px solid var(--edge);border-radius:26px;padding:14px;
  background:radial-gradient(ellipse at 50% 40%,rgba(138,92,51,.14) 0%,transparent 70%)}
.tray .row{min-height:0}
.hint{font-size:12.5px;color:var(--label-2);margin:8px 0 22px}
.unit3{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.unit3 .colhead{margin-bottom:14px}
.sep{cursor:default!important}
.sep:hover{box-shadow:none!important;opacity:.8!important}

.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.title{font-family:var(--f-cd);font-size:38px;font-weight:600;line-height:1;margin:0}
.sub{color:var(--label-2);font-size:14px;margin-top:5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-size:14px;background:#231C15}
.btn:hover{border-color:var(--amber)}
.btn-key{background:var(--amber);color:#1A1208;border-color:var(--amber);font-weight:500}
#q{width:180px}

.meter{display:flex;gap:28px;flex-wrap:wrap;align-items:baseline;padding:14px 0 22px;color:var(--label-2);font-size:13.5px}
.meter b{font-family:var(--f-cd);font-size:27px;font-weight:600;color:var(--label);display:block;line-height:1.05}
.meter .free b{color:var(--amber)} .meter .over b{color:var(--over)}

.shelf{margin:0 0 26px}
.shelf-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:13px;color:var(--label-2)}
.shelf-no{font-family:var(--f-cd);font-size:15px;color:var(--label)}
.shelf-regions{font-family:var(--f-cd);font-size:15px;letter-spacing:.01em;color:var(--label)}
.shelf-cap{margin-left:auto;display:flex;align-items:center;gap:7px}
.shelf-cap button{border-bottom:1px dotted var(--line);color:var(--label-2)}
.shelf-cap button:hover{color:var(--label)}
.shelf-cap input{width:50px;padding:2px 5px;text-align:right}
.free-n{color:var(--amber)}

.board{position:relative;padding-bottom:8px;border-bottom:3px solid var(--edge)}
.row{display:flex;gap:4px;align-items:flex-end;min-height:94px;flex-wrap:wrap}

.b{width:46px;height:88px;flex:none;border-radius:3px 3px 2px 2px;background:var(--label);color:var(--ink);
  position:relative;text-align:center;padding:15px 3px 4px;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.5),inset 0 -14px 12px -12px rgba(0,0,0,.22);transition:transform .12s ease}
.b:hover{transform:translateY(-4px)}
.b .neck{position:absolute;top:0;left:50%;transform:translateX(-50%);width:16px;height:10px;border-radius:0 0 2px 2px}
.b .d{font-family:var(--f-cd);font-size:12.5px;font-weight:600;line-height:1.06;word-break:break-word}
.b .m{font-family:var(--f-cd);font-size:11px;color:#6B5B47;margin-top:2px;line-height:1.1}
.b .n{position:absolute;top:11px;right:3px;font-family:var(--f-cd);font-size:10px;font-weight:600;
  background:var(--ink);color:var(--label);border-radius:2px;padding:0 3px;line-height:1.35}
.b.dim{opacity:.18}
.b.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:translateY(-14px)}100%{transform:none}}
.slot{width:46px;height:88px;flex:none;border:1px dashed var(--slot);border-radius:3px;
  background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(237,228,211,.03) 6px 12px)}
.sep{width:5px;height:94px;flex:none;background:var(--edge);border-radius:1px;position:relative;cursor:pointer;opacity:.8}
.sep:hover{opacity:1;box-shadow:0 0 0 2px rgba(214,154,60,.35)}
.sep.hard{background:var(--amber)}

.spill{border:1px solid var(--over);border-radius:4px;padding:12px 14px;margin-top:4px}
.spill h3{font-family:var(--f-cd);font-size:19px;font-weight:600;margin:0 0 2px;color:var(--over)}
.spill p{margin:0 0 10px;font-size:13.5px;color:var(--label-2)}

.grid{display:flex;flex-wrap:wrap;gap:4px}

.arch{border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-top:30px}
.arch table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.arch th{text-align:left;font-weight:500;color:var(--label-2);font-size:12px;padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.arch td{padding:6px 8px 6px 0;border-bottom:1px solid rgba(237,228,211,.06)}

.scrim{position:fixed;inset:0;background:rgba(8,6,4,.62);opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);
  padding:22px;overflow:auto;transform:translateX(100%);transition:transform .2s ease}
.drawer.on{transform:none}
.drawer h2{font-family:var(--f-cd);font-size:26px;font-weight:600;margin:0 0 2px;line-height:1.1}
.who{color:var(--label-2);font-size:14px;margin-bottom:14px}
.fld{margin:12px 0}
.fld label{display:block;font-size:12px;color:var(--label-2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;font-size:14px;color:var(--label-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--amber);color:#1A1208;font-weight:500}
.specs{font-size:13px;color:var(--label-2);border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.specs div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.specs span{color:var(--label)}
.shot{width:100%;max-height:180px;object-fit:contain;margin:4px 0}
.danger{color:var(--over);border-color:rgba(196,85,60,.4)}
.x{position:absolute;top:14px;right:16px;font-size:24px;line-height:1;color:var(--label-2)}
.stack{font-size:13px;color:var(--label-2);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#2B2118;border:1px solid var(--edge);
  border-radius:4px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:92vw;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.saving{font-size:12px;color:var(--label-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1000px){.units{display:block}.colhead{display:none}}
@media (max-width:620px){.title{font-size:30px}.b,.slot{width:44px;height:80px}.sep{height:86px}#q{width:120px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 class="title">Whisky shelves</h1><div class="sub" id="sub">Loading…</div></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Find a bottle" aria-label="Find a bottle">
      <button class="btn" id="imp">Update from Whiskybase</button>
      <input id="file" type="file" accept=".csv,text/csv" hidden>
      <button class="btn" id="csv">Download CSV</button>
      <button class="btn btn-key" id="add">Add a bottle</button>
    </div>
  </div>
  <div class="meter" id="meter"></div>
  <div class="flow" id="flow"></div>
  <div class="hint" id="hint"></div>
  <div id="shelves"></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><button class="x" id="close">&times;</button><div id="dbody"></div></aside>
<div class="toast" id="toast"></div>

const KEY = 'whisky-shelf-plan-v4';

const REGIONS = ['Islay','Campbeltown','Speyside','Highland','Lowland','Islands','Ireland','World','Blends & bourbon','Unsorted'];
const HUE = {'Islay':'#5E8F86','Campbeltown':'#8E7BB0','Speyside':'#C9A227','Highland':'#7E9B54','Lowland':'#9BB8C4',
  'Islands':'#4E7BA6','Ireland':'#4F9E6A','World':'#C77C4E','Blends & bourbon':'#A8846B','Unsorted':'#8A7963'};
const SHELVES = [
  {id:'L1',unit:'Left',name:'top',col:1,row:1},   {id:'R1',unit:'Right',name:'top',col:2,row:1},
  {id:'L2',unit:'Left',name:'second',col:1,row:2},{id:'R2',unit:'Right',name:'second',col:2,row:2},
  {id:'L3',unit:'Left',name:'middle',col:1,row:3},
  {id:'L4',unit:'Left',name:'fourth',col:1,row:4},{id:'R4',unit:'Right',name:'fourth',col:2,row:4},
  {id:'L5',unit:'Left',name:'bottom',col:1,row:5},{id:'R5',unit:'Right',name:'bottom',col:2,row:5}
];
const ORDERS = {
  rows:{label:'Row by row',seq:['L1','R1','L2','R2','L3','L4','R4','L5','R5'],
        hint:'Left top, across to right top, back to left second. Regions read straight across both units at eye level.'},
  units:{label:'Unit by unit',seq:['L1','L2','L3','L4','L5','R1','R2','R4','R5'],
        hint:'Down the left unit, then down the right. Each unit holds a solid block of regions.'}
};
const OFFSITE = 'Blends & bourbon';
const UNIT3 = [{id:'T1',unit:'Third unit',name:'wherever it lands',col:1,row:1}];
const DEF_CAP = 12;
const byShelf = id => SHELVES.concat(UNIT3).find(s=>s.id===id);

// Claude artifacts expose window.storage; anywhere else (GitHub Pages, a local file)
// fall back to the browser's own store so the file is self-contained.
const STORE = (typeof window!=='undefined' && window.storage && window.storage.get) ? window.storage : {
  get: async k => { const v=localStorage.getItem(k); if(v==null) throw new Error('no key'); return {key:k,value:v}; },
  set: async (k,v) => { localStorage.setItem(k,v); return {key:k,value:v}; }
};
let S=null, dirty=false, openId=null, openWb=null;
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const coll = new Intl.Collator('en',{sensitivity:'base'});

/* ---------- storage ---------- */
async function load(){
  try{ const r = await STORE.get(KEY,false); if(r&&r.value) S = JSON.parse(r.value); }catch(e){}
  if(!S || !Array.isArray(S.bottles) || !S.bottles.length){
    S = {v:2, bottles:SEED.map(b=>({...b})), caps:{}, order:'rows', overrides:{}};
  }
  SHELVES.concat(UNIT3).forEach(s=>{ if(typeof S.caps[s.id]!=='number') S.caps[s.id]=DEF_CAP; });
  if(!ORDERS[S.order]) S.order='rows'; delete S.breaks; S.overrides=S.overrides||{};
  save();
}
let tm;
function save(){ dirty=true; mark(); clearTimeout(tm); tm=setTimeout(async()=>{
  try{ await STORE.set(KEY, JSON.stringify(S), false); dirty=false; }
  catch(e){ toast('Could not save — this change lives in this tab only.'); }
  mark(); },400); }
function mark(){ const e=$('#saving'); if(e) e.textContent = dirty?'saving…':'saved'; }

/* ---------- model ---------- */
// one visual slot per distinct bottling; multiples sit behind each other
function buildRun(only){
  const per = {}; REGIONS.forEach(r=>per[r]=[]);
  S.bottles.filter(b=>b.status==='closed').forEach(b=>(per[b.region]||per['Unsorted']).push(b));
  const run=[];
  REGIONS.filter(r=> only==='offsite' ? r===OFFSITE : r!==OFFSITE).forEach(r=>{
    const m=new Map();
    per[r].sort((a,b)=>coll.compare(a.dist||a.brand,b.dist||b.brand)||coll.compare(a.name,b.name));
    per[r].forEach(b=>{ const k=b.wb||b.id; if(!m.has(k)) m.set(k,{wb:k,region:r,lead:b,bottles:[]}); m.get(k).bottles.push(b); });
    m.forEach(v=>run.push(v));
  });
  return run;
}
function fill(run, shelves){
  const spill=[]; let i=0, prev=null;
  run.forEach(slot=>{
    if(prev && slot.region!==prev) slot.newRegion=true;
    while(shelves[i] && shelves[i].items.length>=shelves[i].cap) i++;
    if(shelves[i]) shelves[i].items.push(slot); else spill.push(slot);
    prev=slot.region;
  });
  return {shelves, spill};
}
function layout(){
  return fill(buildRun(), ORDERS[S.order].seq.map(id=>({...byShelf(id), cap:S.caps[id], items:[]})));
}
function layout3(){
  return fill(buildRun('offsite'), UNIT3.map(s=>({...s, cap:S.caps[s.id], items:[]})));
}

/* ---------- render ---------- */
function render(){
  const {shelves,spill}=layout();
  const off=layout3();
  const opens=S.bottles.filter(b=>b.status==='open').sort((a,b)=>
    REGIONS.indexOf(a.region)-REGIONS.indexOf(b.region)||coll.compare(a.dist||a.brand,b.dist||b.brand));
  const empties=S.bottles.filter(b=>b.status==='empty');
  const used=shelves.reduce((n,s)=>n+s.items.length,0)+spill.length;
  const cap=shelves.reduce((n,s)=>n+s.cap,0);
  const offUsed=off.shelves.reduce((n,s)=>n+s.items.length,0)+off.spill.length;
  const free=Math.max(0,cap-used);

  $('#sub').innerHTML = S.bottles.length+' bottles &middot; '+(used+offUsed)+' slots in use &middot; '+opens.length+
    ' open &middot; '+empties.length+' emptied &middot; <span class="saving" id="saving"></span>';
  $('#meter').innerHTML = stat('Slots needed',used)+stat('Slots you have',cap)+
    (spill.length?stat("Won't fit",spill.length,'over'):stat('Free at the end',free,'free'))+
    stat('Bottles standing behind',S.bottles.filter(b=>b.status==='closed').length-used);

  $('#flow').innerHTML='<span>Bottles run</span>'+Object.keys(ORDERS).map(k=>
    '<button class="btn'+(S.order===k?' on':'')+'" data-order="'+k+'">'+ORDERS[k].label+'</button>').join('');
  $('#hint').textContent=ORDERS[S.order].hint;
  let html='<div class="colhead" style="grid-column:1;grid-row:1">Left unit</div>'+
           '<div class="colhead" style="grid-column:2;grid-row:1">Right unit</div>';
  shelves.forEach((s,idx)=>{ html+=shelfHTML(s,idx+1); });
  html+=trayHTML(opens);
  if(spill.length) html+=spillHTML(spill);
  let h3='<div class="colhead">Third unit &mdash; blends &amp; bourbon, wherever you put it</div>';
  off.shelves.forEach(s=>{ h3+=shelfHTML({...s,col:1,row:1},'\u2022'); });
  if(off.spill.length) h3+=spillHTML(off.spill);
  $('#shelves').innerHTML='<div class="units">'+html+'</div>'+
    '<div class="unit3">'+h3+'</div>'+archiveHTML(empties);
  mark(); filter();
}
const stat=(l,v,c='')=>'<div class="'+c+'"><b>'+v+'</b>'+l+'</div>';

function shelfHTML(s,no){
  const regions=[...new Set(s.items.map(i=>i.region))];
  const freeN=s.cap-s.items.length;
  let inner='',prev=null;
  s.items.forEach(it=>{
    if(prev && it.region!==prev) inner+='<div class="sep" title="'+esc(prev+' | '+it.region)+'"></div>';
    inner+=slotHTML(it); prev=it.region;
  });
  inner+=Array(Math.max(0,freeN)).fill('<div class="slot"></div>').join('');
  return '<section class="shelf" style="grid-column:'+s.col+';grid-row:'+(s.row+1)+'"><div class="shelf-head">'+
    '<span class="seq">'+no+'</span><span class="shelf-no">'+esc(s.unit+' \u00b7 '+s.name)+'</span>'+
    regions.map(r=>'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+HUE[r]+'"></span>').join('')+
    '<span class="shelf-regions">'+(regions.join(' &middot; ')||'empty')+'</span>'+
    '<span class="shelf-cap">'+(freeN>0?'<span class="free-n">'+freeN+' free</span> &middot; ':'')+
    s.items.length+' of <button data-cap="'+s.id+'">'+s.cap+'</button></span>'+
    '</div><div class="board"><div class="row">'+inner+'</div></div></section>';
}
function slotHTML(it){
  const b=it.lead, n=it.bottles.length;
  const meta=b.age?b.age+' yo':(b.vintage||(b.abv?(+b.abv).toFixed(0)+'%':''));
  return '<button class="b" data-id="'+esc(b.id)+'" title="'+esc((b.dist||b.brand)+' — '+b.name+(n>1?'  ('+n+' bottles deep)':''))+'">'+
    '<span class="neck" style="background:'+(HUE[b.region]||'#8A7963')+'"></span>'+
    (n>1?'<span class="n">'+n+'</span>':'')+
    '<span class="d">'+esc(b.dist||b.brand)+'</span><span class="m">'+esc(meta)+'</span></button>';
}
function trayHTML(opens){
  return '<section class="shelf" style="grid-column:2;grid-row:4"><div class="shelf-head">'+
    '<span class="shelf-no">Right \u00b7 middle</span><span class="shelf-regions">Open bottles</span>'+
    '<span class="shelf-cap">'+opens.length+' in the round, no slot limit</span></div>'+
    '<div class="tray"><div class="row">'+opens.map(b=>{
      const meta=b.age?b.age+' yo':(b.vintage||'');
      return '<button class="b" data-id="'+esc(b.id)+'" title="'+esc((b.dist||b.brand)+' \u2014 '+b.name)+'">'+
        '<span class="neck" style="background:'+(HUE[b.region]||'#8A7963')+'"></span>'+
        '<span class="d">'+esc(b.dist||b.brand)+'</span><span class="m">'+esc(meta)+'</span></button>';
    }).join('')+'</div></div></section>';
}
function spillHTML(spill){
  return '<div class="spill wide"><h3>'+spill.length+' slots have nowhere to go</h3>'+
    '<p>Add capacity above, drink something, or accept a tighter squeeze.</p>'+
    '<div class="grid">'+spill.map(slotHTML).join('')+'</div></div>';
}
function archiveHTML(list){
  if(!list.length) return '';
  list=list.slice().sort((a,b)=>coll.compare(a.dist||a.brand,b.dist||b.brand));
  return '<section class="arch"><div class="shelf-head" style="margin:0">'+
    '<span class="shelf-regions">Emptied</span><span class="shelf-cap">'+list.length+' bottles, off the shelves</span></div>'+
    '<table><thead><tr><th>Distillery</th><th>Bottling</th><th>Region</th><th></th></tr></thead><tbody>'+
    list.map(b=>'<tr><td>'+esc(b.dist||b.brand)+'</td><td>'+esc(b.name)+'</td><td>'+esc(b.region)+
      '</td><td style="text-align:right"><button class="btn" data-id="'+esc(b.id)+'">Open</button></td></tr>').join('')+
    '</tbody></table></section>';
}

function filter(){
  const q=$('#q').value.trim().toLowerCase();
  document.querySelectorAll('.b').forEach(el=>{
    if(!q){el.classList.remove('dim');return;}
    const b=byId(el.dataset.id); if(!b) return;
    const hay=[b.brand,b.name,b.dist,b.series,b.region,b.cask,b.vintage].join(' ').toLowerCase();
    el.classList.toggle('dim',!hay.includes(q));
  });
}
const byId=id=>S.bottles.find(b=>String(b.id)===String(id));

/* ---------- drawer ---------- */
function show(id){
  const b=byId(id); if(!b) return; openId=id;
  const sibs=S.bottles.filter(x=>x.wb===b.wb&&x.id!==b.id);
  const seg=st=>'<button data-st="'+st+'" class="'+(b.status===st?'on':'')+'">'+st[0].toUpperCase()+st.slice(1)+'</button>';
  const spec=(l,v)=>v?'<div>'+l+'<span>'+esc(v)+'</span></div>':'';
  $('#dbody').innerHTML='<h2>'+esc(b.dist||b.brand)+'</h2><div class="who">'+esc(b.name)+(b.series?' &middot; '+esc(b.series):'')+'</div>'+
    (b.photo?'<img class="shot" src="'+esc(b.photo)+'" alt="" onerror="this.remove()">':'')+
    '<div class="fld"><label>State</label><div class="seg" id="seg">'+seg('closed')+seg('open')+seg('empty')+'</div></div>'+
    '<div class="fld"><label>Region shelf</label><select id="reg">'+REGIONS.map(r=>'<option'+(r===b.region?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label>Note</label><textarea id="note" rows="2" placeholder="Back row, behind the Ardbegs…">'+esc(b.note||'')+'</textarea></div>'+
    (sibs.length?'<div class="stack">You have '+(sibs.length+1)+' of this bottling &mdash; '+
      sibs.map(x=>x.status).concat(b.status).sort().join(', ')+'. They share one slot.'+
      '<div style="margin-top:8px">'+sibs.map(x=>'<button class="btn" style="margin:0 4px 4px 0" data-id="'+esc(x.id)+'">the '+esc(x.status)+' one</button>').join('')+'</div></div>':'')+
    '<div class="specs">'+spec('Brand',b.brand)+spec('Age',b.age&&b.age+' years')+spec('Vintage',b.vintage)+
      spec('Strength',b.abv&&b.abv+'%')+spec('Size',b.size&&b.size+' ml')+spec('Cask',b.cask)+
      spec('Community rating',b.rating)+spec('Market value',b.value&&('€ '+b.value))+spec('Added',b.added)+'</div>'+
    '<div class="fld" style="margin-top:18px"><button class="btn danger" id="del">Remove from collection</button></div>';
  $('#scrim').classList.add('on'); $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false');
}
function hide(){ openId=null; $('#scrim').classList.remove('on'); $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); }

function setStatus(b,st){
  if(b.status===st) return;
  const before=layout(), fb=before.shelves.reduce((n,s)=>n+(s.cap-s.items.length),0)-before.spill.length;
  b.status=st; save(); render();
  const after=layout(), fa=after.shelves.reduce((n,s)=>n+(s.cap-s.items.length),0)-after.spill.length;
  const d=fa-fb;
  toast((b.dist||b.brand)+' is now '+st+'. '+(d>0?'You just gained '+d+' slot'+(d>1?'s':'')+'.':
        d<0?'That costs you '+(-d)+' slot'+(d<-1?'s':'')+'.':'No change to your space — it was sharing a slot.'));
  const el=document.querySelector('.b[data-id="'+CSS.escape(String(b.id))+'"]'); if(el) el.classList.add('pop');
}

  openId=null;
  $('#dbody').innerHTML='<h2>Add a bottle</h2><div class="who">It slots into the run in the right place.</div>'+

function toCSV(){
  const cols=['dist','brand','name','series','region','status','age','vintage','abv','size','cask','rating','value','added','note'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const blob=new Blob([cols.join(',')+'\r\n'+S.bottles.map(b=>cols.map(c=>q(b[c])).join(',')).join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='whisky-shelves.csv'; a.click();

/* ---- re-import a fresh Whiskybase collection export ---- */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); f=''; rows.push(row); row=[]; }
    else if(c!=='\r') f+=c;
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1).map(r=>{const o={}; head.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o;});
}
function fromRow(r){
  const d=r['Distilleries']||'', b=r['Brand']||'';
  const id=r['CollectionID']||r['ID'];
  return { id:id, wb:r['ID']||id, brand:b, name:r['Name']||'', series:r['Bottling serie']||'',
    dist: DISP_BRAND[b] || DISP_DIST[d] || d || b,
    region: MAP_DIST[d] || MAP_BRAND[b] || 'Unsorted',
    status: r['Bottle Status']||'closed', age:r['Stated Age']||'', size:r['Size']||'',
    abv:r['Strength']||'', cask:r['Cask Type']||'', rating:r['Rating']||'',
    value:r['Average Shop Price']||'', vintage:r['Vintage']||'',
    added:(r['Added on']||'').slice(0,10), photo:r['Photo']||'', note:'' };
}
function importCSV(text){
  let rows;
  try{ rows=parseCSV(text); }catch(e){ toast('That file would not parse as CSV.'); return; }
  if(!rows.length || !('CollectionID' in rows[0])){
    toast('That does not look like a Whiskybase export — no CollectionID column.'); return; }
  const old=new Map(S.bottles.map(b=>[String(b.id),b]));
  const next=rows.map(fromRow), seen=new Set();
  let added=0, moved=0, kept=0;
  next.forEach(b=>{
    seen.add(String(b.id));
    const o=old.get(String(b.id));
    if(!o){ added++; }
    else { b.note=o.note||''; kept++;
      if(S.overrides[b.id]) b.region=S.overrides[b.id];
      else if(o.region!==b.region) b.region=o.region;   // keep a region you set by hand
      if(o.status!==b.status) moved++; }
  });
  const gone=S.bottles.filter(b=>!seen.has(String(b.id)) && !String(b.id).startsWith('new-'));
  const manual=S.bottles.filter(b=>String(b.id).startsWith('new-'));
  S.bottles=next.concat(manual); save(); render();
  const un=next.filter(b=>b.region==='Unsorted').length;
  toast(added+' new, '+gone.length+' gone, '+moved+' changed state'+(un?', '+un+' need a region':'')+'.');
}
